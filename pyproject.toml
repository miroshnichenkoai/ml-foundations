[project]
name = "ml-foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem Miroshnichenko", email = "neoforeve@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[project.scripts]
ml-foundations = "ml_foundations:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff]
ignore = [
    "CPY001",  # Missing copyright notice: Explicit copyright is misleading in an open-source project and conflicts with the public LICENSE file.
    "D203",    # 1 blank line required before class docstring: Disabled to adhere to the alternative 'D211' (no blank lines), avoiding conflicting docstring styles.
    "D213",    # Multi-line docstring summary should start at the second line: Disabled in favor of 'D212' (summary on the first line) for more compact docstrings.
    "COM812",  # Missing trailing comma: Disabled because it conflicts with the Ruff formatter, which handles trailing commas automatically.
]

